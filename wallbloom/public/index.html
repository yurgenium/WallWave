<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WallWave</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/redesign.css"><link rel="stylesheet" href="/source-tiles.css"><script type="module" src="/app.js"></script></head><body>
<aside><div class="brand"><img class="app-mark" src="/app-icon.svg" width="32" height="32" alt=""> WallWave <small>0.4</small></div><p data-t="tagline" class="muted"></p><nav><button data-view="library" data-t="library" class="selected"></button><button data-view="sources" data-t="sources"></button><button data-view="settings" data-t="settings"></button><button data-view="activity" data-t="activity"></button></nav><div class="bottom"><label><span data-t="language"></span><select id="language"><option value="ru">Русский</option><option value="en">English</option></select></label><p id="guard" class="muted"></p></div></aside>
<main><header><div><h1 id="heading"></h1><p class="muted" data-t="explainer"></p></div><div class="header-actions"><div class="analyze-action"><button id="analyze" data-t="analyze"></button><span class="help-tooltip"><button type="button" class="help-icon" data-t-aria="helpLabel" aria-describedby="analyze-help">?</button><span id="analyze-help" role="tooltip" data-t="analyzeHelp"></span></span></div><div class="manual-action"><button id="refresh" class="secondary-action" data-t="refresh"></button><span class="help-tooltip"><button type="button" class="help-icon" data-t-aria="manualHelpLabel" aria-describedby="manual-help">?</button><span id="manual-help" role="tooltip" data-t="manualHelp"></span></span></div></div></header><section id="status" aria-live="polite"><strong id="jobText" data-t="loading"></strong><progress id="progress" value="0" max="1" hidden></progress><div id="downloadProgress" class="download-progress" hidden><label><span id="preparedText"></span><progress id="preparedProgress" value="0" max="1"></progress></label><label><span id="downloadedText"></span><progress id="downloadedProgress" value="0" max="1"></progress></label><small id="downloadQueueInfo" class="muted"></small></div><button id="cancel" data-t="cancel" hidden></button><p id="jobItem"></p><div id="automationInfo"></div></section><p id="message" role="alert"></p>
<section id="library" class="view"><div class="library-toolbar"><div id="filters" class="filters"></div><div class="purity-control"><span data-t="preset" class="purity-label"></span><div id="purity" role="group" aria-label="Content"></div></div></div><div class="library-controls"><button id="pauseAutomation" type="button"></button> <button id="nextWallpaper" data-t="nextWallpaper" type="button"></button> <button id="workMode" data-t="workMode" type="button"></button><label><span data-t="applyMonitor"></span><select id="applyMonitor"></select></label></div><div id="librarySummary" class="library-summary"></div><div id="grid" class="grid"></div><footer id="libraryInfo"></footer><button id="restore" hidden></button></section>
<section id="sources" class="view" hidden><div id="sourceContent"><p class="sources-profile" data-t="sourcesSharedTaste"></p><div id="providers"></div><form id="providerForm" class="panel"><h2 data-t="newSource"></h2><div class="fields"><label><span data-t="name"></span><input name="name" required maxlength="80"></label><label><span data-t="type"></span><select name="type"><option value="local" data-t="local"></option><option value="feed" data-t="feed"></option></select></label><label><span data-t="folder"></span><input name="folder" placeholder="D:\Wallpapers"></label><label><span data-t="url"></span><input name="url" placeholder="https://example.org/wallpapers.json"></label><label><span data-t="rating"></span><select name="rating"><option value="safe" data-t="safe"></option><option value="suggestive" data-t="suggestive"></option><option value="adult" data-t="adult"></option></select></label></div><p data-t="localHelp" class="muted"></p><p data-t="feedHelp" class="muted"></p><button data-t="add" class="primary"></button></form></div></section>
<section id="settings" class="view" hidden><div id="settingsLayout" class="settings-layout"><nav id="settingsTabs" class="settings-tabs" aria-label="Настройки"></nav><div id="settingsContent" class="settings-content"><form id="settingsForm"><div class="panel"><div class="fields"><label><span data-t="preset"></span><select name="preset"><option value="safe" data-t="safe"></option><option value="suggestive" data-t="suggestive"></option><option value="adult" data-t="adult"></option></select></label><label><span data-t="period"></span><select name="period"><option value="1d" data-t="days1"></option><option value="3d" data-t="days3"></option><option value="1w" data-t="week"></option><option value="1M" data-t="month"></option><option value="3M" data-t="months3"></option><option value="6M" data-t="months6"></option><option value="1y" data-t="year"></option></select></label><label><span data-t="tags"></span><textarea name="tags" rows="3" spellcheck="false"></textarea></label><label><span data-t="excludedTags"></span><textarea name="excludedTags" rows="3" spellcheck="false"></textarea></label></div><p data-t="presetHelp" class="muted"></p></div>
<div class="panel"><div class="fields"><label><span data-t="width"></span><input name="width" type="number" min="320" max="16384" required></label><label><span data-t="height"></span><input name="height" type="number" min="240" max="16384" required></label><label><span data-t="fit"></span><select name="fit"><option value="contain" data-t="contain"></option><option value="cover" data-t="cover"></option><option value="inside" data-t="inside"></option></select></label><label><span data-t="quality"></span><input name="quality" type="number" min="30" max="100" required></label></div><p data-t="resizeHelp" class="muted"></p></div>
<div class="panel"><div class="fields"><label><span data-t="maxItemMB"></span><input name="maxItemMB" type="number" min="1" max="100" required></label><label><span data-t="maxTotalGB"></span><input name="maxTotalGB" type="number" min="0.1" max="1000" step="0.1" required></label><label><span data-t="batch"></span><input name="batch" type="number" min="1" max="24" required></label><label><span data-t="refreshMinutes"></span><input name="refreshMinutes" type="number" min="5" max="10080" required></label><label><span data-t="rotationMinutes"></span><input name="rotationMinutes" type="number" min="1" max="10080" required></label></div><label class="check"><input name="autoRefresh" type="checkbox"><span data-t="autoRefresh"></span></label><label class="check"><input name="rotation" type="checkbox"><span data-t="rotation"></span></label></div>
<div class="panel"><div class="fields"><label><span data-t="ai"></span><select name="ai"><option value="off" data-t="off"></option><option value="eco" data-t="eco"></option><option value="auto" data-t="auto"></option></select></label><label><span data-t="aiFilter"></span><select name="aiFilter"><option value="off" data-t="aiFilterOff"></option><option value="cautious" data-t="aiCautious"></option><option value="strict" data-t="aiStrict"></option></select></label><label><span data-t="pauseProcesses"></span><input name="pauseProcesses"></label></div><p data-t="aiHelp" class="muted"></p></div><div class="panel"><h2 data-t="automationSettings"></h2><div class="fields">
<label><span data-t="pendingTarget"></span><input name="pendingTarget" type="number" min="0" max="500" required></label>
<label><span data-t="diversity"></span><input name="diversity" type="number" min="0" max="100" required></label>
<label><span data-t="schedule"></span><input name="schedule" placeholder="09:00, 18:00"></label></div>
<label class="check"><input name="pauseOnBattery" type="checkbox"><span data-t="pauseOnBattery"></span></label>
<label class="check"><input name="changeOnStartup" type="checkbox"><span data-t="changeOnStartup"></span></label>
<label class="check"><input name="changeOnWake" type="checkbox"><span data-t="changeOnWake"></span></label>
<label class="check"><input name="changeAfterFullscreen" type="checkbox"><span data-t="changeAfterFullscreen"></span></label></div>
<div class="panel"><h2 data-t="shortcuts"></h2><label><span data-t="previewLayout"></span><select name="previewLayout"><option value="arrows" data-t="previewLayoutArrows"></option><option value="wasd" data-t="previewLayoutWasd"></option></select></label><p class="muted" data-t="previewLayoutHelp"></p><p class="muted" data-t="shortcutHelp"></p><div class="fields"><label><span data-t="nextWallpaper"></span><input name="shortcut_next" placeholder="Ctrl+Alt+N"><small id="shortcutStatus_next"></small></label><label><span data-t="likeAction"></span><input name="shortcut_like" placeholder="Ctrl+Alt+N"><small id="shortcutStatus_like"></small></label><label><span data-t="banAction"></span><input name="shortcut_ban" placeholder="Ctrl+Alt+N"><small id="shortcutStatus_ban"></small></label><label><span data-t="workMode"></span><input name="shortcut_work" placeholder="Ctrl+Alt+N"><small id="shortcutStatus_work"></small></label></div></div><button class="primary" data-t="save"></button></form>
<div class="panel"><h2 data-t="monitorsTitle"></h2><p class="muted" data-t="monitorHelp"></p><div id="monitorSettings"></div></div>
<div class="panel"><h2 data-t="archiveTitle"></h2><p class="muted" data-t="archiveHelp"></p><form id="exportForm"><label><span data-t="exportFolder"></span><input name="folder" placeholder="D:\Backups" required></label><button data-t="exportLibrary"></button></form><form id="importForm"><label><span data-t="importFolder"></span><input name="folder" required></label><button data-t="importLibrary"></button></form><p id="archiveResult"></p></div></div></div></section>
<section id="activity" class="view" hidden><ol id="events"></ol></section></main><dialog id="frameDialog" aria-labelledby="frameTitle"><header class="frame-header"><div><p class="eyebrow" data-t="frameEyebrow"></p><h2 id="frameTitle" data-t="frameTitle"></h2></div><button id="frameClose" type="button" data-t="close"></button></header><div class="frame-layout"><div class="frame-stage"><img id="framePreview" alt="Предпросмотр обоев"><p id="frameSize"></p><p id="frameSourceNote" class="muted"></p><p id="frameNotice" role="status"></p></div><div class="frame-controls"><label><span data-t="wallpaper"></span><select id="frameItem"></select></label><label><span data-t="monitor"></span><select id="frameMonitor"></select></label><label><span data-t="frameScope"></span><select id="frameScope"><option value="item" data-t="itemFrame"></option><option value="monitor" data-t="monitorTemplate"></option></select></label><p id="frameScopeNote" class="muted"></p><label><span data-t="frameFit"></span><select id="frameFit"><option value="cover" data-t="fillFrame"></option><option value="contain" data-t="containFrame"></option></select></label><label><span><span data-t="horizontalPosition"></span> <output id="frameXValue"></output></span><input id="frameX" type="range" min="0" max="100" value="50"></label><label><span><span data-t="verticalPosition"></span> <output id="frameYValue"></output></span><input id="frameY" type="range" min="0" max="100" value="50"></label><label class="check"><input id="frameFlip" type="checkbox"><span data-t="mirrorFrame"></span></label><div class="frame-secondary"><button id="frameCenter" type="button" data-t="centerFrame"></button><button id="frameReset" type="button" data-t="resetFrame" hidden></button><button id="frameOriginal" type="button" data-t="refreshOriginal"></button></div></div></div><footer class="frame-footer"><button id="frameSave" type="button" data-t="saveFrame"></button><button id="frameApply" type="button" class="primary" data-t="saveAndApply"></button></footer></dialog></body></html>
